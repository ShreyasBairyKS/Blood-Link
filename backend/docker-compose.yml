services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloodlink
      POSTGRES_PASSWORD: bloodlink
      POSTGRES_DB: bloodlink
    ports:
      - "5432:5432"
    volumes:
      - bloodlink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  bloodlink_postgres_data:
